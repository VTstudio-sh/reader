<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Apple Glass Book Reader</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0b0f19, #111827, #1f1d36);
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.18);
      --accent: #3b82f6;
      --accent-heart: #ef4444;
      --accent-flame: #f59e0b;
      --text-main: #f9fafb;
      --text-sub: #9ca3af;
      --radius-lg: 22px;
      --radius-md: 14px;
      --bg-brightness: 100%;
      --bg-blur-val: 25px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0b0f19;
      color: var(--text-main);
      overflow-x: hidden;
    }

    body {
      padding-bottom: 90px;
      position: relative;
    }

    /* ФОНОВЫЕ СЛОИ С ЖЕСТКОЙ БЛОКИРОВКОЙ pointer-events */
    #global-bg {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-size: cover;
      background-position: center;
      filter: brightness(var(--bg-brightness)) blur(var(--bg-blur-val));
      z-index: -9999 !important;
      pointer-events: none !important;
      transition: background-image 0.8s ease;
    }

    #particles-canvas {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -9998 !important;
      pointer-events: none !important;
    }

    /* ИНТЕРФЕЙС */
    .app-container {
      position: relative;
      z-index: 10;
      width: 100%;
    }

    .screen {
      display: none;
      padding: 16px;
    }
    .screen.active { 
      display: block !important; 
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 14px;
      position: relative;
      z-index: 20;
    }

    /* Вкладки сверху */
    .header-tabs {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      padding: 4px;
      border-radius: var(--radius-md);
      margin-bottom: 18px;
      position: relative;
      z-index: 30;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 6px;
      text-align: center;
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-weight: 500;
      font-size: 14px;
      border-radius: 10px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.25);
      color: var(--text-main);
      font-weight: 600;
    }

    /* Карточка книги */
    .book-card {
      display: flex;
      align-items: center;
      position: relative;
      cursor: pointer;
      touch-action: manipulation;
      z-index: 25;
    }

    .book-cover {
      width: 70px;
      height: 70px;
      border-radius: var(--radius-md);
      object-fit: cover;
      pointer-events: none;
    }

    .book-info {
      flex: 1;
      margin-left: 14px;
      margin-right: 40px;
      pointer-events: none;
    }

    .book-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .book-genre { font-size: 12px; color: var(--accent); margin-bottom: 4px; }
    .book-desc-short { font-size: 12px; color: var(--text-sub); }

    .heart-btn {
      position: absolute;
      right: 10px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      cursor: pointer;
      padding: 12px;
      z-index: 40;
      stroke: var(--text-sub); fill: none;
      touch-action: manipulation;
    }
    .heart-btn.active {
      stroke: var(--accent-heart);
      fill: var(--accent-heart);
    }

    /* Кнопки */
    .icon-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid var(--glass-border);
      border-radius: 12px; padding: 12px 16px;
      color: white; display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; gap: 6px; font-size: 14px; font-weight: 500;
      touch-action: manipulation;
      z-index: 30;
    }

    /* Нижнее Меню */
    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 65px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid var(--glass-border);
      display: flex; justify-content: space-around; align-items: center;
      z-index: 999;
    }

    .nav-item {
      background: none; border: none;
      color: var(--text-sub); cursor: pointer;
      display: flex; flex-direction: column; align-items: center;
      padding: 12px;
      touch-action: manipulation;
    }
    .nav-item svg { stroke: var(--text-sub); fill: none; pointer-events: none; }
    .nav-item.active svg { stroke: var(--accent); }

    .nav-item.plus-btn {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      width: 46px; height: 46px; border-radius: 50%;
      justify-content: center; align-items: center;
      padding: 0; margin-bottom: 10px;
    }
    .nav-item.plus-btn svg { stroke: white; }

    /* Читалка */
    .story-bar-wrap {
      width: 100%; height: 4px;
      background: rgba(255,255,255,0.15);
      border-radius: 2px; margin-bottom: 12px; overflow: hidden;
    }
    .story-bar-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.3s; }
    .reader-text-area { font-size: 16px; line-height: 1.6; max-height: 50vh; overflow-y: auto; }

    /* Модалки */
    .modal-overlay {
      position: fixed; top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.85);
      display: none; justify-content: center; align-items: center;
      z-index: 2000; padding: 20px;
    }
    .modal-box {
      background: #171923;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg); padding: 22px;
      width: 100%; max-width: 320px; text-align: center;
    }
    .form-input {
      width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 12px;
      background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);
      border-radius: var(--radius-md); color: white; font-size: 13px;
    }
  </style>
</head>
<body>

  <div id="global-bg"></div>
  <canvas id="particles-canvas"></canvas>

  <div class="app-container">

    <div id="screen-home" class="screen active">
      <div class="header-tabs">
        <button class="tab-btn active" data-cat="all">Здесь</button>
        <button class="tab-btn" data-cat="fantasy">Фэнтези</button>
        <button class="tab-btn" data-cat="adventure">Приключения</button>
      </div>
      <div id="books-list"></div>
    </div>

    <div id="screen-favorites" class="screen">
      <h3 style="margin-bottom: 14px;">Избранное</h3>
      <div id="favorites-list"></div>
    </div>

    <div id="screen-preview" class="screen">
      <button class="icon-btn" style="margin-bottom: 12px;" onclick="showScreen('screen-home')">◄ Назад</button>
      <div class="glass-card" style="text-align: center;">
        <img id="prev-cover" style="width: 140px; height: 140px; border-radius: var(--radius-lg); object-fit: cover; margin-bottom: 12px;">
        <h2 id="prev-title"></h2>
        <p id="prev-genre" style="color: var(--accent); font-size: 12px; margin: 4px 0 10px 0;"></p>
        <p id="prev-desc" style="color: var(--text-sub); font-size: 13px; margin-bottom: 16px;"></p>
        <button class="icon-btn" style="width: 100%; justify-content: center; background: var(--accent);" onclick="startReading(false)">Читать</button>
      </div>
    </div>

    <div id="screen-reader" class="screen">
      <div class="story-bar-wrap"><div id="story-bar" class="story-bar-fill"></div></div>
      <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
        <button class="icon-btn" onclick="exitReader()">◄ Выйти</button>
        <button class="icon-btn" onclick="openBgSettings()">⚙ Настройки</button>
      </div>
      <div class="glass-card">
        <div id="reader-text" class="reader-text-area"></div>
      </div>
      <div style="display: flex; gap: 10px;">
        <button class="icon-btn" style="flex: 1;" onclick="prevPage()">◄ Назад</button>
        <button class="icon-btn" style="flex: 1; background: var(--accent);" onclick="nextPage()">Дальше ►</button>
      </div>
    </div>

    <div id="screen-goals" class="screen">
      <h3 style="margin-bottom: 12px;">Цели и Серия дней</h3>
      <div class="glass-card">🔥 Серия чтения: <b>5 дней подряд</b></div>
    </div>

    <div id="screen-add" class="screen">
      <h3 style="margin-bottom: 12px;">Конструктор книг</h3>
      <div class="glass-card">
        <input type="text" id="add-title" class="form-input" placeholder="Название...">
        <textarea id="add-text" class="form-input" rows="4" placeholder="Текст книги..."></textarea>
        <button class="icon-btn" style="width:100%; background:var(--accent);" onclick="addNewBook()">Сохранить</button>
      </div>
    </div>

    <div id="screen-profile" class="screen">
      <h3 style="margin-bottom: 12px;">Профиль</h3>
      <div class="glass-card" style="text-align: center;">Читатель Telegram</div>
    </div>

  </div>

  <div class="bottom-bar">
    <button class="nav-item active" onclick="navTo('screen-home', this)">
      <svg width="22" height="22" viewBox="0 0 24 24" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </button>
    <button class="nav-item" onclick="navTo('screen-favorites', this)">
      <svg width="22" height="22" viewBox="0 0 24 24" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
    </button>
    <button class="nav-item plus-btn" onclick="navTo('screen-add', this)">
      <svg width="22" height="22" viewBox="0 0 24 24" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="nav-item" onclick="navTo('screen-goals', this)">
      <svg width="22" height="22" viewBox="0 0 24 24" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
    </button>
    <button class="nav-item" onclick="navTo('screen-profile', this)">
      <svg width="22" height="22" viewBox="0 0 24 24" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </button>
  </div>

  <div id="bg-modal" class="modal-overlay">
    <div class="modal-box">
      <h4>Яркость фона</h4>
      <input type="range" id="bg-bright-range" min="15" max="100" value="100" oninput="updateBgStyle()" style="width:100%; margin: 16px 0;">
      <button class="icon-btn" style="width:100%;" onclick="closeBgModal()">Готово</button>
    </div>
  </div>

  <script>
    // Принудительный старт Telegram API
    try {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }
    } catch (e) { console.log(e); }

    let books = [
      {
        id: 1, title: "Тайна древнего замка", genre: "fantasy", genreLabel: "Фэнтези",
        cover: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400",
        desc: "История о туманных горах и заброшенном замке.",
        scenes: [{ text: "Густой туман опустился на старый замок...", bg: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1000" }]
      },
      {
        id: 2, title: "Океан звезд", genre: "adventure", genreLabel: "Приключения",
        cover: "https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?w=400",
        desc: "Космическое путешествие.",
        scenes: [{ text: "Корабль вышел из гиперпространства...", bg: "https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?w=1000" }]
      }
    ];

    let favorites = [];
    let currentBook = null;
    let currentSceneIdx = 0;

    document.addEventListener("DOMContentLoaded", () => {
      renderBooks('all');
      initParticles();

      // Навешиваем слушатели на вкладки
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          renderBooks(e.target.dataset.cat);
        });
      });
    });

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function navTo(id, btn) {
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      if(btn) btn.classList.add('active');
      showScreen(id);
      if(id === 'screen-favorites') renderFavorites();
    }

    function renderBooks(cat) {
      const container = document.getElementById('books-list');
      container.innerHTML = '';
      let list = cat === 'all' ? books : books.filter(b => b.genre === cat);

      list.forEach(b => {
        const isFav = favorites.includes(b.id);
        const card = document.createElement('div');
        card.className = 'glass-card book-card';
        card.innerHTML = `
          <img class="book-cover" src="${b.cover}">
          <div class="book-info">
            <div class="book-title">${b.title}</div>
            <div class="book-genre">${b.genreLabel}</div>
            <div class="book-desc-short">${b.desc}</div>
          </div>
          <button class="heart-btn ${isFav ? 'active' : ''}">
            <svg width="20" height="20" viewBox="0 0 24 24" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </button>
        `;

        card.querySelector('.heart-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          toggleFav(b.id, e.currentTarget);
        });

        card.addEventListener('click', () => openPreview(b));
        container.appendChild(card);
      });
    }

    function toggleFav(id, btn) {
      if(favorites.includes(id)) {
        favorites = favorites.filter(f => f !== id);
        btn.classList.remove('active');
      } else {
        favorites.push(id);
        btn.classList.add('active');
      }
    }

    function renderFavorites() {
      const container = document.getElementById('favorites-list');
      container.innerHTML = '';
      let favs = books.filter(b => favorites.includes(b.id));
      if(!favs.length) { container.innerHTML = '<p style="font-size:12px; color:var(--text-sub);">Избранного пока нет.</p>'; return; }
      favs.forEach(b => {
        const card = document.createElement('div');
        card.className = 'glass-card book-card';
        card.innerHTML = `<img class="book-cover" src="${b.cover}"><div class="book-info"><div class="book-title">${b.title}</div></div>`;
        card.addEventListener('click', () => openPreview(b));
        container.appendChild(card);
      });
    }

    function openPreview(b) {
      currentBook = b;
      document.getElementById('prev-cover').src = b.cover;
      document.getElementById('prev-title').innerText = b.title;
      document.getElementById('prev-genre').innerText = b.genreLabel;
      document.getElementById('prev-desc').innerText = b.desc;
      showScreen('screen-preview');
    }

    function startReading() {
      currentSceneIdx = 0;
      showScreen('screen-reader');
      updateScene();
    }

    function updateScene() {
      const sc = currentBook.scenes[currentSceneIdx];
      document.getElementById('reader-text').innerText = sc.text;
      document.getElementById('global-bg').style.backgroundImage = `url('${sc.bg}')`;
      document.getElementById('story-bar').style.width = '100%';
    }

    function nextPage() { alert("Это последняя страница"); }
    function prevPage() { alert("Это первая страница"); }
    function exitReader() { showScreen('screen-home'); }

    function openBgSettings() { document.getElementById('bg-modal').style.display = 'flex'; }
    function closeBgModal() { document.getElementById('bg-modal').style.display = 'none'; }
    function updateBgStyle() {
      let br = document.getElementById('bg-bright-range').value;
      if(br < 15) br = 15;
      document.documentElement.style.setProperty('--bg-brightness', br + '%');
    }

    function addNewBook() {
      const title = document.getElementById('add-title').value;
      const text = document.getElementById('add-text').value;
      if(!title || !text) { alert("Заполните поля!"); return; }
      books.push({
        id: Date.now(), title: title, genre: "fantasy", genreLabel: "Свое",
        cover: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400",
        desc: "Новая книга",
        scenes: [{ text: text, bg: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=1000" }]
      });
      alert("Сохранено!");
      renderBooks('all');
      navTo('screen-home', document.querySelectorAll('.nav-item')[0]);
    }

    function initParticles() {
      const cvs = document.getElementById('particles-canvas');
      const ctx = cvs.getContext('2d');
      cvs.width = window.innerWidth; cvs.height = window.innerHeight;
      let pts = Array.from({length: 25}, () => ({
        x: Math.random()*cvs.width, y: Math.random()*cvs.height,
        r: Math.random()*1.5 + 0.5, dY: Math.random()*0.3 + 0.1, o: Math.random()*0.5 + 0.2
      }));
      function anim() {
        ctx.clearRect(0,0,cvs.width,cvs.height);
        pts.forEach(p => {
          ctx.fillStyle = `rgba(255,255,255,${p.o})`;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
          p.y -= p.dY; if(p.y < 0) p.y = cvs.height;
        });
        requestAnimationFrame(anim);
      }
      anim();
    }
  </script>
</body>
</html>
